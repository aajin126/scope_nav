map_type: costmap
origin_z: 0.0
z_resolution: 1
z_voxels: 2

obstacle_range: 2.5
raytrace_range: 3.0

publish_voxel_map: false
transform_tolerance: 0.5
meter_scoring: true

footprint: [[-0.17, -0.17], [-0.17, 0.17], [0.17, 0.17], [0.17, -0.17]]
footprint_padding: 0.1

plugins:
- {name: obstacle_layer, type: "costmap_2d::VoxelLayer"}
- {name: inflation_layer, type: "costmap_2d::InflationLayer"}

obstacle_layer:
  observation_sources: scan
  scan: {sensor_frame: laser_link, data_type: LaserScan, topic: /scan, marking: true, clearing: true, min_obstacle_height: -2.0, max_obstacle_height: 2.0, obstacle_range: 2.5, raytrace_range: 3.0}

inflation_layer:
 inflation_radius: 0.30

# add scope costmap layers:
scope_prediction_layer:
  grid_topic: local_map
  enabled:               true
  min_value:             1
  transform_tolerance:   0.3
